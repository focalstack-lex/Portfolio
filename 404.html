<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found · Lex Matondo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/img/focal-stack-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --text: #f2f2f0;
      --muted: #999999;
      --border: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 2rem 1rem;
    }

    main {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .code {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    h1 {
      font-size: clamp(2.25rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.08;
    }

    p { color: var(--muted); max-width: 480px; line-height: 1.6; }

    nav { display: flex; flex-wrap: wrap; gap: 1rem 1.75rem; margin-top: 0.75rem; }

    a {
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding: 10px 0 2px;
    }

    a.secondary { color: var(--muted); }
    a:hover { opacity: 0.7; }
    a:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
  </style>
</head>

<body>
  <main>
    <span class="code">404 / NOT FOUND</span>
    <h1>This frame is out of focus.</h1>
    <p>The page you were looking for moved or never existed. Pick up from one of these instead.</p>
    <nav aria-label="Recovery links">
      <a href="/portfolio.html?mode=code">TECH WORK →</a>
      <a href="/portfolio.html?mode=create">PHOTOGRAPHY →</a>
      <a class="secondary" href="/">HOME</a>
    </nav>
  </main>
</body>

</html>
